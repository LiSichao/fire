name: "💡 Feature request / 功能建议"
description: "Suggest an improvement to FIRE / 提议改进 FIRE"
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea. Explain the problem first, then the proposed solution.
        感谢提出建议。请先说明要解决的问题，再描述建议方案。

        Please do not include real financial records or personal account information.
        请勿在功能建议中提交真实财务记录或个人账户信息。
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case / 问题或使用场景
      description: What are you trying to accomplish? / 你希望完成什么目标？
      placeholder: "As a user, I need… / 作为用户，我需要…"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / 建议方案
      description: Describe the behavior or workflow you have in mind. / 描述你设想的功能或使用流程。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 已考虑的替代方案
      description: Optional. Include relevant trade-offs. / 选填，可说明取舍。
    validations:
      required: false
  - type: checkboxes
    id: considerations
    attributes:
      label: Impact considerations / 影响范围
      options:
        - label: This may change financial formulas, assumptions, or interpretation / 该功能可能影响财务公式、模型假设或结果解读
          required: false
        - label: This may change data collection, network access, or persistence / 该功能可能改变数据收集、网络访问或持久化行为
          required: false
